name: 診断 オッズの比較

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pandas numpy
      - name: 比べる
        run: |
          git fetch -q --depth=1 origin gh-pages && git show FETCH_HEAD:predictions.csv > pred.csv
          python - <<'PY'
          import sys, json, urllib.request, pandas as pd
          sys.path.insert(0, "src")
          from fetch_odds import fetch_odds_http, ODDS_API
          d = pd.read_csv("pred.csv", dtype={"race_id": str})
          for rid in ["202605050311", "202608050211", "202605050301"]:
              req = urllib.request.Request(ODDS_API.format(race_id=rid), headers={"User-Agent": "Mozilla/5.0", "X-Requested-With": "XMLHttpRequest", "Referer": "https://race.netkeiba.com/"})
              raw = urllib.request.urlopen(req, timeout=15).read().decode()
              o = json.loads(raw)
              dat = o.get("data") or {}
              print(rid, "status", o.get("status"), "official", (dat or {}).get("official_datetime") if isinstance(dat, dict) else dat, "types", list(((dat or {}).get("odds") or {}).keys()) if isinstance(dat, dict) else None)
              api1 = {int(k): v[0] for k, v in ((dat.get("odds") or {}).get("1") or {}).items()} if isinstance(dat, dict) else {}
              parsed = fetch_odds_http(rid)
              site = dict(zip(d[d.race_id == rid].umaban.astype(int), d[d.race_id == rid].odds_win))
              for u in sorted(api1):
                  print(f"  {u:2d} API単勝={api1[u]:>6}  解析={parsed.get(u)}  サイト={site.get(u)}")
          PY
