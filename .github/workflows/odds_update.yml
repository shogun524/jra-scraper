name: JRAオッズ定期更新

# 予測(モデル実行)はそのままに、オッズと期待値・人気との乖離・妙味だけを最新化するジョブ。
# ブラウザを使わずAPIを叩くだけなので、1回あたり数十秒で終わる。
on:
  schedule:
    # JST 土・日・月 の 9:00〜16:50 に10分おき(UTC 0:00〜7:50)。
    # GitHubの定期実行は混雑時に数分〜十数分遅れたり間引かれたりすることがある。
    - cron: "*/10 0-7 * * 6,0,1"
    # 金・土の夜は翌日のレースの前日発売オッズ(JST 19:17・21:17・23:17)
    - cron: "17 10,12,14 * * 5,6"
  workflow_dispatch: {}

# 予測ジョブと同じグループにして、同時にPagesへ書き込まないよう順番待ちさせる
concurrency:
  group: jra-pages
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  update-odds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 定期実行が間引かれて当日の常駐(keeper.yml)が動いていなければ起こす
      - name: 常駐更新が止まっていれば起こす
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          hm=$(TZ=Asia/Tokyo date +%H%M)
          if [ "$hm" -ge 0800 ] && [ "$hm" -lt 1630 ]; then
            n=$(gh run list --workflow keeper.yml --limit 5 --json status --jq '[.[]|select(.status=="in_progress" or .status=="queued")]|length')
            if [ "$n" = "0" ]; then gh workflow run keeper.yml --ref "${GITHUB_REF_NAME}" && echo "keeper を起動しました"; fi
          fi

      # 現在公開中のページ(予測結果の predictions.csv を含む)を site/ に取り出す
      - name: 公開中のページを取得
        id: site
        run: |
          mkdir -p site
          if git fetch --depth=1 origin gh-pages; then
            # .git を含めずにファイルだけを site/ に展開する
            git --work-tree=site checkout FETCH_HEAD -- .
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::gh-pages ブランチがまだありません。先に予測ジョブを実行してください"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.site.outputs.exists == 'true'
        with:
          python-version: "3.11"

      - name: 依存関係インストール
        if: steps.site.outputs.exists == 'true'
        run: pip install pandas numpy beautifulsoup4 lxml requests

      # 終了コード 0=更新した / 2=今日の予測がない等で更新対象なし(正常)
      - name: オッズ更新
        id: odds
        if: steps.site.outputs.exists == 'true'
        run: |
          set +e
          python src/update_odds.py site/predictions.csv --only-upcoming
          code=$?
          set -e
          if [ "$code" = "0" ]; then
            echo "updated=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" = "2" ]; then
            echo "::notice::今日の予測がないため、オッズ更新をスキップしました"
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            exit "$code"
          fi

      # 馬連・ワイドのオッズと単勝オッズを時系列で記録し、馬体重を更新し、その時点のEVを記録する
      # (失敗してもオッズ更新・ページ生成は続ける)
      - name: オッズの記録・馬体重・EV
        if: steps.odds.outputs.updated == 'true'
        continue-on-error: true
        run: python src/odds_snapshot.py site/predictions.csv site || [ $? -eq 2 ]

      # 終わったレースの結果を取って当日のトラックバイアス(内外)の計算に使う(失敗してもページは出す)
      - name: 当日の終わったレースの結果
        if: steps.odds.outputs.updated == 'true'
        continue-on-error: true
        run: python src/live_results.py site/history site/predictions.csv

      - name: ダッシュボードHTML再生成
        if: steps.odds.outputs.updated == 'true'
        run: python src/generate_html.py site/predictions.csv site/index.html

      # 発走前に大きく下がった馬・組の一覧(drops.html)

      # できあがりPDF(アプリ内ブラウザでは印刷ボタンが動かないので、ダウンロードだけで済むように)。20分おきに作り直す
      - name: 印刷用のPDFを作る
        if: steps.odds.outputs.updated == 'true'
        continue-on-error: true
        run: |
          python -c "import sys,json,time; d=json.load(open('site/pdf/index.json')); sys.exit(0 if time.time()-d.get('ts',0)<1200 else 1)" 2>/dev/null && { echo "前回から20分たっていないので作らない"; exit 0; }
          sudo apt-get install -y -qq fonts-noto-cjk fonts-ipaexfont >/dev/null 2>&1 || true
          pip install -q playwright pypdf
          python -m playwright install chromium >/dev/null
          python src/print_pdf.py site/print.html site/pdf
      - name: オッズ急落ページ
        if: steps.odds.outputs.updated == 'true'
        continue-on-error: true
        run: python src/drops_page.py site/predictions.csv site

      # デプロイ用アクション(peaceiris)は、このジョブの使い方では内部の作業フォルダを
      # gitリポジトリとして扱えず失敗したため、gitコマンドで直接 gh-pages に書き込む。
      # site/ の中身をそのまま1コミットにして gh-pages を置き換える。
      - name: GitHub Pagesへデプロイ
        if: steps.odds.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd site
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "オッズ更新 $(TZ='Asia/Tokyo' date '+%Y-%m-%d %H:%M')"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" gh-pages
          echo "デプロイしました"
