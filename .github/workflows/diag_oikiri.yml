name: diag_oikiri
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q requests beautifulsoup4 lxml
      - run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          UA={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36"}
          r=requests.get("https://race.netkeiba.com/race/oikiri.html?race_id=202603030411&type=2",headers=UA,timeout=20)
          for enc in ("utf-8","euc-jp"):
              try: h=r.content.decode(enc); print("enc",enc); break
              except UnicodeDecodeError: pass
          s=BeautifulSoup(h,"lxml"); t=s.select_one("table.OikiriTable")
          trs=t.select("tr"); print("rows",len(trs))
          for tr in trs[:4]: print(str(tr)[:2500]); print("-----")
          PY
