name: JRA週末AI予測 自動更新

on:
  schedule:
    # JST 土・日 の 朝7:00 / 9:30 / 11:00 / 12:30 / 14:00 / 15:30 に実行
    # (UTC では前日の 22:00 と、当日の 0:30 / 2:00 / 3:30 / 5:00 / 6:30)
    # 朝7時はオッズ未確定のことが多いため、レース当日の日中も繰り返し実行して
    # 最新オッズ・馬体重を反映した予測に更新していく。
    - cron: "0 22 * * 5,6"     # JST 土日 7:00
    - cron: "30 0 * * 6,0"     # JST 土日 9:30
    - cron: "0 2 * * 6,0"      # JST 土日 11:00
    - cron: "30 3 * * 6,0"     # JST 土日 12:30
    - cron: "0 5 * * 6,0"      # JST 土日 14:00
    - cron: "30 6 * * 6,0"     # JST 土日 15:30
  workflow_dispatch: {}

# 同じワークフローが重なった場合は、後から起動したほう(=より新しいオッズ)を優先する
concurrency:
  group: jra-predict
  cancel-in-progress: true

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存関係インストール
        run: |
          pip install duckdb lightgbm pandas numpy beautifulsoup4 lxml playwright
          playwright install chromium --with-deps

      # ------------------------------------------------------------------
      # 当週の出馬表(未来のレース情報)を取得
      # data/race_result.csv 側の「直近成績」は最新化され続けている前提ではないため、
      # predict.py側の安全装置(古すぎる馬の成績はNaN扱い)がここでも効く。
      # ------------------------------------------------------------------
      - name: 今日の日付(JST)を取得
        id: today
        run: echo "date=$(TZ='Asia/Tokyo' date +%F)" >> "$GITHUB_OUTPUT"

      - name: 大容量データ(race_result_merged.csv)をGitHub Releaseから取得
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download data-v1 --pattern "race_result_merged.csv" --dir data --clobber

      - name: 出馬表スクレイピング
        run: python src/scrape_entries.py ${{ steps.today.outputs.date }} --out data/entries_this_week.csv

      - name: 【デバッグ用】出馬表スクレイパーの診断(1レース分)
        if: always()
        run: |
          RACE_ID=$(python -c "import pandas as pd; df=pd.read_csv('data/entries_this_week.csv'); print(df['race_id'].iloc[0])" 2>/dev/null || echo "")
          if [ -n "$RACE_ID" ]; then
            python src/scrape_entries.py --diagnose "$RACE_ID" > data/diagnose_output.txt 2>&1 || true
          fi

      - name: 【デバッグ用】オッズ取得状況の診断
        if: always()
        run: python src/diagnose_odds.py data/entries_this_week.csv > data/diagnose_odds.txt 2>&1 || true

      - name: AI予測を実行
        run: python src/predict.py data/entries_this_week.csv

      - name: ダッシュボードHTML生成
        run: |
          python src/generate_html.py data/predictions.csv docs/index.html
          python src/generate_course_guide.py

      - name: 中間ファイルをダウンロードできるように保存(デバッグ用)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jra-debug-files
          path: |
            data/entries_this_week.csv
            data/predictions.csv
            data/diagnose_output.txt
            data/diagnose_odds.txt
            data/diagnose_shutuba_screenshot.png
          retention-days: 7
          if-no-files-found: ignore

      - name: GitHub Pagesへデプロイ
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
