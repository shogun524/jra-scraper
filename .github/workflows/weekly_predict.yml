name: JRA週末AI予測 自動更新

on:
  schedule:
    # JSTの土・日・月(祝日開催がある)の 朝7:00 / 9:30 / 11:00 / 12:30 / 14:00 / 15:30
    # UTCでは前日の22:00と当日の0:30/2:00/3:30/5:00/6:30にあたる。
    # 朝はオッズ未確定のことが多いため、当日の日中も繰り返し実行して
    # 最新オッズを反映した予測に更新していく。
    # 開催がない日に動いても、スクレイピングが終了コード2で正常スキップする。
    - cron: "0 22 * * 5,6,0"    # JST 土日月 7:00
    - cron: "30 0 * * 6,0,1"    # JST 土日月 9:30
    - cron: "0 2 * * 6,0,1"     # JST 土日月 11:00
    - cron: "30 3 * * 6,0,1"    # JST 土日月 12:30
    - cron: "0 5 * * 6,0,1"     # JST 土日月 14:00
    - cron: "30 6 * * 6,0,1"    # JST 土日月 15:30
  workflow_dispatch:
    inputs:
      date:
        description: "予測する日付。空欄=今日 / tomorrow=翌日 / YYYY-MM-DD で直接指定(例 2026-09-27)"
        required: false
        default: ""

# 実行が重なった場合は後から起動したほう(=より新しいオッズ)を優先する
# オッズ定期更新(odds_update.yml)と同じグループにして、
# 2つのジョブが同時にGitHub Pagesへ書き込んで結果を上書きし合わないよう順番待ちさせる。
concurrency:
  group: jra-pages
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存関係インストール
        run: |
          pip install duckdb lightgbm pandas numpy beautifulsoup4 lxml playwright
          playwright install chromium --with-deps

      # 対象日を決める。
      # 定期実行(schedule)では入力が空になるので、これまで通り「今日(JST)」になる。
      # 手動実行で tomorrow や YYYY-MM-DD を入れると、その日の予測を作る。
      # 金曜夜に土曜、土曜夜に日曜の予測を先に見たい、という使い方を想定。
      - name: 対象日(JST)を決定
        id: today
        env:
          INPUT_DATE: ${{ github.event.inputs.date }}
        run: |
          d="${INPUT_DATE:-}"
          case "$d" in
            "")         d=$(TZ='Asia/Tokyo' date +%F) ;;
            tomorrow)   d=$(TZ='Asia/Tokyo' date -d '+1 day' +%F) ;;
            today)      d=$(TZ='Asia/Tokyo' date +%F) ;;
            *)
              if ! printf '%s' "$d" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
                echo "::error::日付は YYYY-MM-DD 形式か tomorrow で指定してください(入力: $d)"
                exit 1
              fi
              ;;
          esac
          echo "対象日: $d (今日は $(TZ='Asia/Tokyo' date +%F))"
          echo "date=$d" >> "$GITHUB_OUTPUT"

      - name: 大容量データ(race_result_merged.csv)をGitHub Releaseから取得
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download data-v1 --pattern "race_result_merged.csv" --dir data --clobber

      # 出馬表スクレイピング。
      # 終了コード 0=成功 / 1=取得失敗(要調査) / 2=その日は開催なし(正常)
      # teeでログを残すと終了コードが握りつぶされるため、PIPESTATUSで本来の値を取り出す。
      - name: 出馬表スクレイピング
        id: scrape
        run: |
          set +e
          python src/scrape_entries.py "${{ steps.today.outputs.date }}" \
            --out data/entries_this_week.csv 2>&1 | tee data/scrape_log.txt
          code=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "2" ]; then
            echo "::notice::${{ steps.today.outputs.date }} はJRAの開催がない(または出馬表が未発表)ため、以降の処理をスキップします"
            echo "has_races=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$code" != "0" ]; then
            echo "::error::出馬表を取得できませんでした。data/scrape_log.txt を確認してください"
            echo "has_races=false" >> "$GITHUB_OUTPUT"
            exit "$code"
          fi
          echo "has_races=true" >> "$GITHUB_OUTPUT"

      - name: AI予測を実行
        if: steps.scrape.outputs.has_races == 'true'
        run: python src/predict.py data/entries_this_week.csv

      - name: ダッシュボードHTML生成
        if: steps.scrape.outputs.has_races == 'true'
        run: |
          python src/generate_html.py data/predictions.csv docs/index.html
          python src/generate_course_guide.py
          # オッズ定期更新ジョブが読み込めるよう、予測結果も公開ページに置く
          cp data/predictions.csv docs/predictions.csv
          # 成績検証用に日付ごとの予測を保存(結果記録ジョブが夕方に突き合わせる)
          mkdir -p docs/history
          cp data/predictions.csv "docs/history/predictions_${{ steps.today.outputs.date }}.csv"

      - name: 中間ファイルをダウンロードできるように保存(デバッグ用)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jra-debug-files
          path: |
            data/entries_this_week.csv
            data/predictions.csv
            data/scrape_log.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: GitHub Pagesへデプロイ
        if: steps.scrape.outputs.has_races == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          # 過去の予測・結果の記録(history/)や成績ページを消さないよう、既存ファイルを残す
          keep_files: true
