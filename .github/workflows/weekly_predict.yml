name: JRA週末AI予測 自動更新

on:
  schedule:
    # JST土曜7:00 / 日曜7:00 に実行 (UTC 22:00 金/土)
    - cron: "0 22 * * 5,6"
  workflow_dispatch: {}

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存関係インストール
        run: |
          pip install duckdb lightgbm pandas numpy beautifulsoup4 lxml playwright
          playwright install chromium --with-deps

      # ------------------------------------------------------------------
      # 当週の出馬表(未来のレース情報)を取得
      # data/race_result.csv 側の「直近成績」は最新化され続けている前提ではないため、
      # predict.py側の安全装置(古すぎる馬の成績はNaN扱い)がここでも効く。
      # ------------------------------------------------------------------
      - name: 今日の日付(JST)を取得
        id: today
        run: echo "date=$(TZ='Asia/Tokyo' date +%F)" >> "$GITHUB_OUTPUT"

      - name: 大容量データ(race_result_merged.csv)をGitHub Releaseから取得
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download data-v1 --pattern "race_result_merged.csv" --dir data --clobber

      - name: 出馬表スクレイピング
        run: python src/scrape_entries.py ${{ steps.today.outputs.date }} --out data/entries_this_week.csv

      - name: AI予測を実行
        run: python src/predict.py data/entries_this_week.csv

      - name: ダッシュボードHTML生成
        run: python src/generate_html.py data/predictions.csv docs/index.html

      - name: 中間ファイルをダウンロードできるように保存(デバッグ用)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jra-debug-files
          path: |
            data/entries_this_week.csv
            data/predictions.csv
          retention-days: 7

      - name: GitHub Pagesへデプロイ
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
